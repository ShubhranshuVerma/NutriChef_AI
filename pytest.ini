[pytest]
testpaths = tests
addopts = -ra
markers =
    slow: long-running tests (model downloads, big data)
    llm: calls the real Gemini API (skipped unless RUN_LLM_TESTS=1)
filterwarnings =
    # Starlette's own test client, not our code. Narrow on purpose: our own
    # deprecations must still show up.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
